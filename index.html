<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>DeBit ⚡</title>
  
  <style>
    html, body {
      background-color: #090d16 !important;
      color: #ffffff !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #090d16;">

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="brand-logo">DeBit ⚡</div>
    <div id="level-title">Lvl 1: Baby Bot</div>
    <div id="stat-amount">0 / 100 Intel</div>
    
    <!-- Intel Level Progress Bar -->
    <div id="intel-bar-outer">
      <div id="intel-bar-fill"></div>
    </div>
  </div>

  <!-- Game Over Emergency Revive Screen -->
  <div id="revive-screen" class="hidden">
    <div class="revive-card">
      <div class="revive-title">BOT FAINTED ⚡</div>
      <div class="revive-msg">Health reached 0%. Reviving will shock the bot back to life, but all Intelligence memory will be lost!</div>
      <button id="revive-btn" onclick="revivePet()">⚡ Emergency Revive (Reset Intel)</button>
    </div>
  </div>

  <!-- Bottom Tamagotchi Status Bars -->
  <div id="bottom-hud">
    <div class="bar-container" id="food-container" onclick="selectMeter('food')">
      <span class="bar-label">FOOD</span>
      <div class="bar-outer">
        <div class="bar-fill" id="food-fill"></div>
      </div>
    </div>

    <div class="bar-container" id="health-container">
      <span class="bar-label">HEALTH</span>
      <div class="bar-outer">
        <div class="bar-fill" id="health-fill"></div>
      </div>
    </div>

    <div class="bar-container" id="water-container" onclick="selectMeter('water')">
      <span class="bar-label">WATER</span>
      <div class="bar-outer">
        <div class="bar-fill" id="water-fill"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
