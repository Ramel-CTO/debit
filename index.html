<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>DeBit ⚡</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DeBit">
  
  <style>
    html, body {
      background-color: #090d16 !important;
      color: #ffffff !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #090d16;">

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="brand-logo">DeBit ⚡</div>
    <div id="level-title">Lvl 1: Baby Bot</div>
    <div id="stat-amount">0 / 100 Intel</div>
    
    <div id="intel-bar-outer">
      <div id="intel-bar-fill"></div>
    </div>
  </div>

  <div id="revive-screen" class="hidden">
    <div class="revive-card">
      <div class="revive-title">SYSTEM OVERHEAT ⚡</div>
      <div class="revive-msg">Compute reached 0%! Shocking the core will reboot the bot, but all Intel memory will be wiped!</div>
      <button id="revive-btn" onclick="revivePet()">⚡ Emergency Reboot (Reset Intel)</button>
    </div>
  </div>

  <div id="bottom-hud">
    <div class="bar-container" id="energy-container" onclick="selectMeter('energy')">
      <span class="bar-label">ENERGY</span>
      <div class="bar-outer">
        <div class="bar-fill" id="energy-fill"></div>
      </div>
    </div>

    <div class="bar-container" id="health-container">
      <span class="bar-label">COMPUTE</span>
      <div class="bar-outer">
        <div class="bar-fill" id="health-fill"></div>
      </div>
    </div>

    <div class="bar-container" id="water-container" onclick="selectMeter('water')">
      <span class="bar-label">WATER</span>
      <div class="bar-outer">
        <div class="bar-fill" id="water-fill"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker Registered'))
          .catch((err) => console.log('SW Registration Failed:', err));
      });
    }
  </script>
</body>
</html>
