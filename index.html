<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>DeBit ⚡</title>
  
  <style>
    html, body {
      background-color: #090d16 !important;
      color: #ffffff !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>

  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #090d16;">

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="brand-logo">DeBit ⚡</div>
    <div id="stat-label">BOT INTELLIGENCE</div>
    <div id="stat-amount">0 Intel</div>
    <button id="reset-btn" onclick="resetPet()">Reset Pet</button>
  </div>

  <!-- Bottom Tamagotchi Status Bars -->
  <div id="bottom-hud">
    <div class="bar-container" id="food-container" onclick="selectMeter('food')">
      <span class="bar-label">FOOD</span>
      <div class="bar-outer">
        <div class="bar-fill" id="food-fill"></div>
      </div>
    </div>

    <div class="bar-container" id="health-container">
      <span class="bar-label">HEALTH</span>
      <div class="bar-outer">
        <div class="bar-fill" id="health-fill"></div>
      </div>
    </div>

    <div class="bar-container" id="water-container" onclick="selectMeter('water')">
      <span class="bar-label">WATER</span>
      <div class="bar-outer">
        <div class="bar-fill" id="water-fill"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
