<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DeBit – Microchip Bug Squisher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div id="brand-logo">DeBit ⚡</div>
    <div id="allowance-label">Active Allowance</div>
    <div id="allowance-amount">$0.00</div>
  </div>

  <!-- Rounded Speech Bubble Chat Box -->

    <div class="bubble-arrow"></div>
    <span id="tip-text">Welcome! Tap the microchip bugs to squish them and earn your allowance!</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
